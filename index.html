<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>Diario de Estudio</h1>

        <!-- Racha actual -->
        <section class="racha">
            <div class="racha-actual">
                <svg class="llama" viewBox="0 0 64 64" aria-hidden="true">
                    <defs>
                        <linearGradient id="LlamaTarjeta" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fbbf24"/>
                            <stop offset="1" stop-color="#ea580c"/>
                        </linearGradient>
                    </defs>
                    <path d="M32 8c1.6 8.5-2.4 13-6.4 16.7C21.9 28.4 19 32.3 19 38a13 13 0 0 0 26 0c0-4.5-1.9-7.8-4.3-10.9-1.2 2.1-2.8 3.6-4.7 4.3C37.2 25.8 34.5 18.2 32 8Z" fill="url(#LlamaTarjeta)"/>
                </svg>
                <span class="racha-numero" id="rachaNumero">0</span>
                <span class="racha-texto">días seguidos</span>
            </div>

            <!-- Estadísticas secundarias -->
            <div class="racha-stats">
                <div class="stat">
                    <span class="stat-label">Mejor racha</span>
                    <span class="stat-valor"><span id="mejorRachaNumero">0</span> días</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Este mes</span>
                    <span class="stat-valor"><span id="diasMesNumero">0</span> días</span>
                </div>

                <!-- Objetivo semanal: ocupa el hueco de la estadística "Esta semana" -->
                <div class="objetivo" id="objetivoSemanal">
                    <div class="objetivo-cabecera">
                        <span class="objetivo-etiqueta" id="objetivoEtiqueta">Objetivo semanal</span>
                        <button type="button" class="objetivo-editar" id="objetivoEditar">Cambiar objetivo</button>
                    </div>

                    <p class="objetivo-linea" id="objetivoLinea"></p>

                    <div class="objetivo-barra" id="objetivoBarra"
                         role="progressbar" aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="0">
                        <span class="objetivo-barra-valor" id="objetivoBarraValor"></span>
                    </div>

                    <form class="objetivo-form" id="objetivoForm" hidden>
                        <label for="objetivoCampo">Objetivo en minutos</label>
                        <input id="objetivoCampo" name="objetivo" type="text" inputmode="numeric"
                               autocomplete="off" spellcheck="false">
                        <div class="objetivo-acciones">
                            <button type="submit" class="objetivo-guardar">Guardar</button>
                            <button type="button" class="objetivo-cancelar" id="objetivoCancelar">Cancelar</button>
                        </div>
                    </form>

                    <p class="objetivo-mensaje" id="objetivoMensaje" hidden></p>
                    <p class="objetivo-aviso" id="objetivoAviso" hidden></p>
                </div>
            </div>
        </section>

        <!-- Mapa de calor -->
        <section class="mapa" id="mapaCalor">
            <h2>Mapa de calor</h2>

            <div class="mapa-filtro">
                <label for="filtroDesde">Desde</label>
                <input type="date" id="filtroDesde">
                <label for="filtroHasta">Hasta</label>
                <input type="date" id="filtroHasta">
                <button type="button" id="filtroLimpiar" class="boton-secundario">Quitar filtro</button>
            </div>

            <div class="mapa-scroll" id="mapaScroll">
                <div class="mapa-meses" id="mapaMeses" aria-hidden="true"></div>
                <div class="mapa-rejilla" id="mapaRejilla" role="grid" aria-label="Mapa de calor de días estudiados en los últimos doce meses"></div>
            </div>

            <p class="mapa-panel" id="mapaPanel">Toca un día para ver su detalle.</p>

            <p class="mapa-aviso" id="mapaAviso" hidden></p>

            <ul class="mapa-leyenda" aria-label="Leyenda de intensidad">
                <li><span class="mapa-muestra nivel-0"></span> Sin estudio</li>
                <li><span class="mapa-muestra nivel-1"></span> 1-29 min</li>
                <li><span class="mapa-muestra nivel-2"></span> 30-59 min</li>
                <li><span class="mapa-muestra nivel-3"></span> 60-119 min</li>
                <li><span class="mapa-muestra nivel-4"></span> 120+ min</li>
            </ul>
        </section>

        <!-- Formulario para nueva sesión -->
        <section class="formulario">
            <h2 id="tituloFormulario">Registrar sesión</h2>
            <form id="formularioSesion">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>

                <label for="tema">Tema</label>
                <input type="text" id="tema" placeholder="¿Qué estudiaste?" required>

                <label for="minutos">Minutos</label>
                <input type="number" id="minutos" min="1" placeholder="Ej: 45" required>

                <button type="submit" id="botonGuardar">Guardar sesión</button>
                <button type="button" id="botonCancelar" class="boton-secundario" hidden>
                    Cancelar edición
                </button>
            </form>
        </section>

        <!-- Lista de sesiones -->
        <section class="sesiones">
            <h2>Sesiones</h2>
            <ul id="listaSesiones"></ul>
            <p id="listaVacia" class="lista-vacia">Aún no hay sesiones registradas.</p>
        </section>
    </div>

    <footer>
        <p>v1.9.0</p>
    </footer>

    <script src="heatmap-logic.js"></script>
    <script src="session-list-logic.js"></script>
    <script src="weekly-goal-logic.js"></script>
    <script src="heatmap-ui.js"></script>
    <script src="weekly-goal-ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
