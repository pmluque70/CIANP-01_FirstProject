<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>Diario de Estudio</h1>

        <!-- Racha actual -->
        <section class="racha">
            <span class="racha-numero" id="rachaNumero">0</span>
            <span class="racha-texto">días de racha 🔥</span>
            <p class="mejor-racha">Mejor racha: <span id="mejorRachaNumero">0</span> días</p>
            <p class="minutos-semana">Esta semana: <span id="minutosSemana">0</span> min</p>
            <p class="dias-mes"><span id="diasMesNumero">0</span> días este mes</p>
        </section>

        <!-- Formulario para nueva sesión -->
        <section class="formulario">
            <h2>Registrar sesión</h2>
            <form id="formularioSesion">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>

                <label for="tema">Tema</label>
                <input type="text" id="tema" placeholder="¿Qué estudiaste?" required>

                <label for="minutos">Minutos</label>
                <input type="number" id="minutos" min="1" placeholder="Ej: 45" required>

                <button type="submit">Guardar sesión</button>
            </form>
        </section>

        <!-- Lista de sesiones -->
        <section class="sesiones">
            <h2>Sesiones</h2>
            <ul id="listaSesiones"></ul>
            <p id="listaVacia" class="lista-vacia">Aún no hay sesiones registradas.</p>
        </section>
    </div>

    <footer>
        <p>v1.3.0</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
